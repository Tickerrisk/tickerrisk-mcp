[project]
name = "tickerrisk-mcp"
version = "0.1.0"
description = "MCP server that checks options trades for hidden catalysts (earnings, FDA, legal, SEC) before you sell premium"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TickerRisk" }]
keywords = [
    "mcp", "model-context-protocol", "options", "options-trading", "wheel",
    "cash-secured-put", "covered-call", "implied-volatility", "earnings", "risk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://tickerrisk.com"
Source = "https://github.com/Tickerrisk/tickerrisk-mcp"
Issues = "https://github.com/Tickerrisk/tickerrisk-mcp/issues"

[project.scripts]
tickerrisk-mcp = "tickerrisk_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tickerrisk_mcp"]
